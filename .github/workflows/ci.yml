name: CI
on:
  push:
  pull_request:
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.f.outputs.api }}
      mobile: ${{ steps.f.outputs.mobile }}
      ops: ${{ steps.f.outputs.ops }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api: ['apps/api/**']
            mobile: ['apps/mobile/**']
            ops: ['apps/api/**', 'apps/mobile/android/**', 'apps/mobile/ios/**', 'apps/mobile/env/**', 'infra/**', 'scripts/**']
  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: apps/api } }
    # amd64 runner: the official postgis image (local dev on Apple silicon uses infra/postgis/Dockerfile instead).
    services:
      db:
        image: postgis/postgis:17-3.5
        env: { POSTGRES_USER: saarthee, POSTGRES_PASSWORD: change-me, POSTGRES_DB: saarthee_test }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U saarthee -d saarthee_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Same URLs as .env.test.example, so the copied file works unchanged.
      DATABASE_URL: postgresql://saarthee:change-me@127.0.0.1:5433/saarthee_test
      SHADOW_DATABASE_URL: postgresql://saarthee:change-me@127.0.0.1:5433/saarthee_shadow
      PGPASSWORD: change-me
      # T-13-01 runs the storage contract suite against MinIO as the R2 stand-in (V2 TASK-13).
      R2_TEST_ENDPOINT: http://127.0.0.1:9000
    steps:
      - name: MinIO (R2 stand-in)
        working-directory: .
        run: >-
          docker run -d --name minio -p 9000:9000
          minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e server /data
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/api/package-lock.json }
      - run: npm ci
      - run: npx prisma generate
      - name: v1 migration checksum gate
        run: npm run db:check-v1
      - run: npm run typecheck
      - run: npm run lint
      - name: Test env and shadow database
        run: |
          cp .env.test.example .env.test
          psql -h 127.0.0.1 -p 5433 -U saarthee -d postgres -c 'CREATE DATABASE saarthee_shadow'
      - name: Prisma drift gate
        run: npm run db:drift
      - name: API tests (Vitest + Supertest)
        run: npm test
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: api-junit, path: apps/api/test-results/junit.xml, if-no-files-found: warn }
  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && hashFiles('apps/mobile/pubspec.yaml') != ''
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: dart analyze
  ops:
    # V2 TASK-13 S-13-01: cleartext rule, static site, deploy scripts, production images.
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: No cleartext outside debug builds
        run: bash scripts/check-cleartext.sh
      - name: Privacy and deletion pages
        run: node scripts/check-site.mjs
      - name: Shellcheck deploy scripts
        run: shellcheck -S warning infra/deploy/*.sh scripts/check-cleartext.sh
      - name: Build API production image
        run: docker build -t saarthee-api:ci apps/api
      - name: Build Caddy image (validates both Caddyfiles)
        run: docker build -f infra/deploy/caddy.Dockerfile -t saarthee-caddy:ci infra/deploy
      - name: Image runs as non-root and has no secrets
        run: |
          test "$(docker run --rm --entrypoint id saarthee-api:ci -u)" = "10001"
          ! docker history --no-trunc saarthee-api:ci | grep -iE 'password=|secret=|DATABASE_URL=postgres'
