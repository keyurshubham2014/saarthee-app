# Build, push and deploy (V2 TASK-13 step 8; runbook docs/ops/deploy.md).
#   staging: automatically after CI succeeds on main.
#   pilot:   manual (workflow_dispatch) with the GitHub environment "pilot" requiring a reviewer.
# Required configuration (GitHub → Settings → Environments; no values in git):
#   environment staging / pilot:  secrets DEPLOY_SSH_KEY (ed25519 private key, deploy user only),
#     DEPLOY_KNOWN_HOSTS (ssh-keyscan of the Droplet); variables DEPLOY_HOST, DEPLOY_USER, API_HOSTNAME.
name: Deploy
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        type: choice
        options: [staging, pilot]
        default: pilot
      tag:
        description: Image tag (git sha) — defaults to the current commit
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

env:
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/saarthee-api
  IMAGE_CADDY: ghcr.io/${{ github.repository_owner }}/saarthee-caddy

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.event.workflow_run.head_sha || github.sha }}
      - id: t
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          platforms: linux/amd64
          push: true
          build-args: APP_RELEASE=${{ steps.t.outputs.tag }}
          tags: ${{ env.IMAGE_API }}:${{ steps.t.outputs.tag }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Caddy image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: infra/deploy
          file: infra/deploy/caddy.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_CADDY }}:${{ steps.t.outputs.tag }}

  staging:
    needs: build
    if: github.event_name == 'workflow_run' || github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "sudo /opt/saarthee/deploy.sh ${{ needs.build.outputs.tag }}"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.API_HOSTNAME }}/api/v1/health" | grep -q '"status":"ok"'

  pilot:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pilot'
    runs-on: ubuntu-latest
    environment: pilot # required reviewer: founder or build lead
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" \
            "sudo /opt/saarthee/deploy.sh ${{ needs.build.outputs.tag }}"
      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ vars.API_HOSTNAME }}/api/v1/health" | grep -q '"status":"ok"'
