# Local PostgreSQL + PostGIS only. The API runs natively (05 §1.1).
# Host port 5433 because 5432 is already taken on the dev machine (ASSUMPTION, TASK-01 §5.6); bound to 127.0.0.1 only.
name: saarthee
services:
  db:
    # PostGIS for ward geometry and issue locations (v2 Spec D10). Same PostgreSQL major (17) as v1's
    # postgres:17.6, so the existing volume is reused (scripts/db-upgrade-postgis.sh dumps first).
    # The image has no linux/arm64 build: Apple-silicon Macs run it as amd64 under Rosetta; CI is amd64.
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
